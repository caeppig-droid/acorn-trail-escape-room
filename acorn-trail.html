<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acorn Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --dusk:#261B36; --dusk2:#3A2A4F; --line:#6D5888;
  --birch:#FFF6E6; --soft:#F1E2C6; --bark:#3A2619;
  --maple:#C2412D; --mustard:#E6A532; --moss:#557530; --lake:#3F6E99;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:17px;line-height:1.45;
  color:var(--birch);min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -10%,#6a3f55 0%,transparent 60%),
    radial-gradient(700px 400px at 0% 110%,#3d4a2a 0%,transparent 60%),
    linear-gradient(180deg,#2C1F3F,#1D1528);
}
h1,h2,h3,.disp{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.1;margin:0;font-weight:800}
h2{font-size:1.7rem} h3{font-size:1.2rem}
p{margin:.3em 0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:.6em 1.25em;font-weight:700;background:var(--maple);color:#fff;font-size:1rem;white-space:nowrap}
.btn.gold{background:var(--mustard);color:var(--bark)}
.btn.moss{background:var(--moss)}
.btn.lake{background:var(--lake)}
.btn.alt{background:transparent;color:var(--bark);box-shadow:inset 0 0 0 2px var(--bark)}
.btn.big{font-size:1.25rem;padding:.7em 1.6em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--birch);color:var(--bark);border-radius:22px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.row{display:flex;align-items:center}
.between{justify-content:space-between}.end{justify-content:flex-end}.wrap{flex-wrap:wrap}
.gap{gap:10px}.row.between{gap:12px}
.mt{margin-top:14px}
.sub{color:#6b5443;max-width:62ch}
.err{color:var(--maple);font-weight:700;min-height:1.4em}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bark);color:#fff;padding:.7em 1.2em;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}

/* Trail strip */
.trail{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 4px}
.stop{flex:1;min-width:78px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;background:none;border:0;color:#cdbbdc;font-size:.82rem;text-align:center;padding:4px 2px;line-height:1.15}
.stop::before{content:'';position:absolute;top:24px;right:50%;width:100%;border-top:3px dotted var(--line);z-index:0}
.stop:first-child::before{display:none}
.stop .pip{width:42px;height:42px;border-radius:50%;background:var(--dusk2);display:grid;place-items:center;font-size:1.25rem;position:relative;z-index:1;border:2px solid var(--line);transition:transform .2s}
.stop.done .pip{background:var(--moss);border-color:var(--moss)}
.stop.done::before,.stop.now::before{border-top-style:solid;border-color:var(--moss)}
.stop.now .pip{background:var(--mustard);border-color:#FFF0C8;transform:scale(1.15)}
.stop.now{color:#fff;font-weight:700}
.stop small{opacity:.7}
button.stop:hover .pip{border-color:#fff}

/* Landing & join */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.hero{text-align:center;max-width:560px}
.hero h1{font-size:clamp(3rem,10vw,5.5rem);color:var(--birch);letter-spacing:-.01em}
.hero .leaves{font-size:2.6rem;letter-spacing:.2em}
.hero p{color:#e5d6ef;font-size:1.15rem}
.hero .row{justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.joincard{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.joincard h1{font-size:2.6rem}
.joincard label{display:flex;flex-direction:column;font-weight:700;gap:4px}
.joincard input{font:inherit;font-size:1.3rem;padding:.5em .7em;border-radius:12px;border:2px solid #cbb592;background:#fff;color:var(--bark)}
.status{color:#e5d6ef;text-align:center;font-size:1.2rem}

/* Teacher */
.t-shell{max-width:1240px;margin:0 auto;padding:14px 18px 40px;display:flex;flex-direction:column;gap:10px}
.t-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:1.9rem}
.brand .acorn{font-size:1.8rem}
.t-room{margin-left:auto;font-size:1.05rem}
.t-room b{font-family:'Baloo 2',sans-serif;font-size:1.6rem;letter-spacing:.12em;background:var(--mustard);color:var(--bark);padding:0 .45em;border-radius:10px;margin-left:6px}
.t-count{color:#e5d6ef}
.switch{display:flex;gap:6px;align-items:center;color:#e5d6ef;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--mustard)}
.lobby{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.bigcode{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(3.5rem,8vw,6rem);letter-spacing:.14em;color:var(--maple);line-height:1;margin:10px 0}
.linkrow{display:flex;gap:8px;margin-top:6px}
.linkrow input{flex:1;min-width:0;font:inherit;padding:.5em .7em;border-radius:999px;border:2px solid #cbb592;background:#fff;color:var(--bark)}
.roster{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:60px;align-content:flex-start}
.rchip{background:var(--soft);border-radius:999px;padding:.25em .8em;font-weight:700}
.rchip.off{opacity:.4}
.lobby .row.end{grid-column:1/-1}
.listen{background:#fff;border-radius:18px;padding:16px 20px;border:2px solid var(--soft)}
.para{font-size:1.35rem;line-height:1.65;max-width:62ch;margin:12px 0}
.para mark{background:#F8D57E;color:inherit;padding:.05em .15em;border-radius:4px}
.hiddenpara{color:#7a6350;font-style:italic;font-size:1.05rem}
.switch.dark{color:var(--bark)}
.case{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:rgba(255,246,230,.07);border:2px solid rgba(255,246,230,.16);border-radius:18px;padding:10px 14px}
.case p{flex:1;min-width:240px;margin:0;font-size:1.08rem;color:#fff}
.case .btn.light{color:var(--birch);box-shadow:inset 0 0 0 2px var(--birch)}
.lock{display:flex;gap:6px;justify-content:center}
.tile{width:42px;height:50px;border-radius:10px;background:var(--dusk2);border:2px solid var(--line);display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1rem;color:var(--bark)}
.tile.on{background:var(--mustard);border-color:#FFF0C8;font-size:1.8rem}
.tile.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.lock.big{margin:18px 0}
.lock.big .tile{width:72px;height:88px;font-size:1.6rem;border-radius:14px}
.lock.big .tile.on{font-size:3rem}
.lesson h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:6px}
.lead b,.tip b{white-space:nowrap}
.kicker{font-weight:700;color:var(--maple);margin:0 0 4px}
.lead{font-size:1.3rem;max-width:62ch}
.lcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
.lcard{background:#fff;border-radius:18px;padding:16px 18px;border:2px solid var(--soft)}
.lh{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.2rem;line-height:1.1;margin-bottom:6px}
.lcard p{font-size:1.15rem}
.exs,.pairs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.exs span,.pairs span{background:var(--soft);border-radius:10px;padding:.2em .7em;font-size:1.35rem;font-weight:700}
.exs b,.pairs b,.syl b,.cw b{color:var(--maple)}
.tip{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:1.15rem}
.lsvg{width:min(420px,100%);display:block;margin:10px 0;border:2px solid var(--soft);border-radius:14px}
.lsteps{font-size:1.15rem;line-height:1.7;padding-left:1.4em}
.codegrid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;margin-top:14px}
.codecard{text-align:center;background:#fff;border-radius:18px;padding:16px;border:2px solid var(--soft);margin-bottom:12px}
.codecard .pic{font-size:5rem;line-height:1.1}
.cw{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:3rem;line-height:1.2;margin:4px 0;letter-spacing:.03em}
.cw .gap{display:inline-block;min-width:1.4em}
.hint{font-size:1.3rem}
.blankin{width:2.2em;font:inherit;text-align:center;border:0;border-bottom:4px solid var(--maple);background:#FFF1D2;border-radius:8px 8px 0 0;color:var(--maple);padding:0 .05em;margin:0 .05em}
.blankin.ok{background:#d4ebc1;border-color:var(--moss);color:var(--moss)}
.blankin.no{background:#f6cbc0}
.bonus{display:flex;flex-direction:column;gap:6px;font-weight:700;margin-top:10px}
.bonus input{font:inherit;font-size:1.4rem;padding:.4em .7em;border-radius:12px;border:2px solid #cbb592;max-width:320px;color:var(--bark)}
@media (max-width:820px){ .lcards,.codegrid{grid-template-columns:1fr} .cw{font-size:2.4rem} }
.clue{font-size:1.6rem;font-weight:700;margin:12px 0 14px;max-width:46ch}
.tally{display:flex;gap:16px;font-size:1.15rem;font-weight:700}
.reveal{margin-top:14px;padding:14px 18px;border-radius:16px;background:var(--soft);font-size:1.15rem}
.reveal b{font-family:'Baloo 2',sans-serif;font-size:1.4rem}
.timer{font-family:'Baloo 2',sans-serif;font-size:3.4rem;font-weight:800;color:var(--maple);min-width:2.2em;text-align:right;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--soft);border-radius:16px;padding:12px 14px}
.stat .n{font-family:'Baloo 2',sans-serif;font-size:2.2rem;font-weight:800;line-height:1}
.key{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.key div{background:#fff;border-radius:14px;padding:10px 14px;border:2px solid var(--soft)}
.dice-grid{display:grid;grid-template-columns:230px 220px 1fr;gap:24px;margin-top:14px;align-items:start}
.verbs{margin:0;padding-left:1.6em;font-size:1.3rem;font-weight:700;line-height:1.8}
.verbs li.cur button{color:var(--maple);text-decoration:underline;text-underline-offset:4px}
.verbs button{border:0;background:none;font:inherit;color:inherit;padding:0 .2em;border-radius:6px;text-align:left}
.verbs li.done button{color:var(--moss)}
.verbs li.done::marker{color:var(--moss)}
.jprog{display:flex;flex-wrap:wrap;gap:6px}
.jc{background:var(--soft);border-radius:999px;padding:.15em .7em;font-weight:700;font-size:.95rem;color:#7a6350}
.jc.on{background:#d4ebc1;color:#2f4a16}
.dice-center{display:flex;flex-direction:column;align-items:center;gap:14px}
.sent{font-size:1.3rem;margin:0 0 10px}
.sent .blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--bark);text-align:center;font-weight:800;color:var(--moss)}
.bar{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:8px;margin:6px 0;font-weight:700}
.bar .track{height:22px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar .fill{height:100%;background:var(--lake);border-radius:999px;transition:width .3s}
.bar.right .fill{background:var(--moss)}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0}
.wheelbox{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.wheelbox canvas{width:min(280px,100%);height:auto}
.wheelbox::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);border:14px solid transparent;border-top:22px solid var(--bark);z-index:1}
.codeword{font-family:'Baloo 2',sans-serif;font-size:2rem;font-weight:800;min-height:1.3em}
.reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.rep{background:#fff;border-radius:14px;padding:12px 14px;border:2px solid var(--soft);display:flex;flex-direction:column;gap:8px}
.rep .who{font-weight:700;color:#7a6350;font-size:.9rem}
.rep p{font-size:1.1rem}
.checks{display:flex;gap:6px;flex-wrap:wrap;font-size:.9rem;font-weight:700}
.chk{padding:.1em .6em;border-radius:999px;background:#f3d9d2;color:#8a2c1c}
.chk.ok{background:#dbeccb;color:#2f4a16}
.spotbox{background:var(--mustard);color:var(--bark);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:1.15rem;margin:8px 0}
.sky-t{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;align-items:start}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{border:3px solid transparent;border-radius:12px;padding:0;background:#fff;overflow:hidden;text-align:left;font-size:.82rem;font-weight:700;color:var(--bark)}
.thumb img{display:block;width:100%;aspect-ratio:900/560;object-fit:cover}
.thumb span{display:block;padding:3px 6px}
.thumb.sel{border-color:var(--maple)}
.viewer img{width:100%;border-radius:14px;border:2px solid var(--soft);display:block}
.viewer .row{margin-top:10px}
.empty{color:#7a6350;background:var(--soft);border-radius:14px;padding:18px;text-align:center}
.wrapup{text-align:center;padding:40px 22px}
.wrapup h2{font-size:clamp(2.4rem,6vw,3.6rem)}
.wrapup .leaves{font-size:3rem;letter-spacing:.2em}

/* Shared: map */
.map{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:18px;overflow:hidden;min-height:280px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:16px;text-align:center;transition:filter .3s}
.side .em{font-size:clamp(3.5rem,9vw,5rem);line-height:1.1}
.side b{font-family:'Baloo 2',sans-serif;font-size:2.2rem;line-height:1}
.side small{font-size:1rem}
.side.fact{background:linear-gradient(160deg,#F8CB72,#E2843A)}
.side.fib{background:linear-gradient(200deg,#C3D9A9,#7EA266)}
.map.revealed .side.dim{filter:grayscale(.9) brightness(.85)}
.map.revealed .side.win{box-shadow:inset 0 0 0 6px var(--bark)}
.dots{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--dusk);border:2px solid #fff;opacity:.85}
.dot.me{width:auto;height:auto;margin:0;transform:translate(-50%,-60%);background:none;border:0;font-size:2.3rem;opacity:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

/* Student */
.s-shell{max-width:980px;margin:0 auto;padding:10px 14px 40px;display:flex;flex-direction:column;gap:8px}
.s-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.s-top .disp{font-size:1.5rem}
.me{display:flex;align-items:center;gap:8px;font-weight:700}
.conn{width:12px;height:12px;border-radius:50%;background:#d1593f}
.conn.on{background:#8BC34A}
.waitcard{text-align:center;padding:34px 20px}
.waitcard .big{font-size:3.4rem}
.waitcard h2{font-size:2rem;margin:6px 0}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px;padding:12px;border-radius:16px;background:var(--soft);margin:12px 0}
.chip{border:0;border-radius:12px;padding:.4em .9em;font-size:1.4rem;font-weight:700;background:#fff;color:var(--bark);box-shadow:0 3px 0 #c9b38f;transition:transform .12s}
.chip.sel{background:var(--mustard);transform:translateY(-3px)}
.chip.ok{background:#d4ebc1;box-shadow:0 3px 0 #8fb36f}
.chip.no{background:#f6cbc0;box-shadow:0 3px 0 #d98f7d}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bucket{border:3px dashed #c9b38f;border-radius:18px;min-height:190px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--bark);text-align:center}
.bucket.ready{border-color:var(--maple);border-style:solid}
.bucket .bh{font-family:'Baloo 2',sans-serif;font-size:2.4rem;font-weight:800;line-height:1}
.bucket .bs{font-size:.95rem;color:#6b5443}
.bucket .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.die{width:110px;height:110px;background:#fff;border-radius:22px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;box-shadow:0 6px 0 #c9b38f;border:2px solid var(--soft)}
.die i{width:20px;height:20px;border-radius:50%;background:var(--maple);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.big{width:150px;height:150px;padding:20px}
.die.big i{width:26px;height:26px}
.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.opt{border:0;border-radius:16px;background:#fff;color:var(--bark);font-size:1.6rem;font-weight:800;font-family:'Baloo 2',sans-serif;padding:.4em 1.1em;box-shadow:0 4px 0 #c9b38f}
.opt.pick{background:var(--mustard)}
.opt.right{background:#cfe8b9;box-shadow:0 4px 0 #8fb36f}
.opt.wrong{background:#f6cbc0;box-shadow:0 4px 0 #d98f7d}
.dicewrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:12px}
.codes{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.code{background:var(--dusk);color:var(--mustard);font-family:'Baloo 2',sans-serif;font-size:1.9rem;font-weight:800;padding:.1em .8em;border-radius:12px;letter-spacing:.04em}
textarea{width:100%;font:inherit;font-size:1.3rem;padding:.6em .8em;border-radius:14px;border:2px solid #cbb592;min-height:110px;resize:vertical;color:var(--bark)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.toolset{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:2px solid #d8c4a2;background:#fff;color:var(--bark);border-radius:12px;padding:4px 10px;font-size:1.2rem;display:flex;align-items:center;gap:5px}
.tool span{font-size:.85rem;font-weight:700}
.tool[aria-pressed="true"]{background:var(--mustard);border-color:var(--bark)}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d8c4a2}
.sw.sel{box-shadow:0 0 0 3px var(--bark);transform:scale(1.1)}
.stamps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.stamp{border:2px solid var(--maple);background:#fff;color:var(--bark);border-radius:999px;padding:4px 12px;font-weight:700}
.stamp.sel{background:var(--maple);color:#fff}
.canvaswrap canvas{width:100%;height:auto;display:block;border-radius:14px;border:2px solid #d8c4a2;touch-action:none;background:#fff}
.overlay{position:fixed;inset:0;background:rgba(20,12,28,.82);display:grid;place-items:center;padding:20px;z-index:40}
.overlay .panel{max-width:900px;width:100%;max-height:92vh;overflow:auto}
.overlay img{width:100%;border-radius:14px;display:block;margin:10px 0}
@media (max-width:820px){
  .lobby,.sky-t,.dice-grid{grid-template-columns:1fr}
  .clue{font-size:1.3rem}
  .wheels{grid-template-columns:1fr}
}
@media (max-width:520px){
  .buckets{grid-template-columns:1fr}
  .panel{padding:16px;border-radius:18px}
  .map{min-height:220px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ============ CONTENT ============ */
const ROOM_PREFIX = 'acorntrail-';
const STAGES = [
  {id:'lobby', short:'Case File', icon:'📁', min:0},
  {id:'fib',   short:'Witnesses', icon:'🗣️', min:5},
  {id:'sort',  short:'Root Door', icon:'🚪', min:3},
  {id:'dice',  short:'Owl’s Journal', icon:'📓', min:3},
  {id:'spy',   short:'Code Wheel', icon:'🦝', min:4},
  {id:'sky',   short:'Star Map', icon:'🌙', min:5},
  {id:'wrap',  short:'The Lock', icon:'🔓', min:0}

function startHost(){
  if(typeof Peer === 'undefined'){ app.innerHTML = `<div class="center"><p class="status">PeerJS didn’t load. Check the internet connection and reload.</p></div>`; return; }
  H.code = ss.get('at_host_code') || makeCode();

function openHostPeer(tries){
  if(H.peer){ try{ H.peer.destroy(); }catch(e){} }
  H.online = false;
  const peer = new Peer(ROOM_PREFIX + H.code);
  H.peer = peer;
  peer.on('open', () => { ss.set('at_host_code', H.code); H.online = true; hostRender(); });
  peer.on('connection', conn => {
    conn.on('data', m => hostMsg(conn, m));
    conn.on('close', () => { for(const st of H.students.values()) if(st.conn===conn) st.online=false; hostRender(); });
    conn.on('error', () => {});
  });
  peer.on('error', err => {
    if(err.type==='unavailable-id'){
      if(tries < 2) setTimeout(()=>openHostPeer(tries+1), 2500);
      else { H.code = makeCode(); openHostPeer(0); }
    } else if(['network','server-error','socket-error','socket-closed'].includes(err.type)){
      toast('Room server connection dropped. Reconnecting…');
    }
    hostRender();
  });
  peer.on('disconnected', () => { setTimeout(()=>{ try{ if(!peer.destroyed && peer.disconnected) peer.reconnect(); }catch(e){} }, 1500); });
  hostRender();
}

    st.name = cleanName(m.name); st.conn = conn; st.online = true;
    send(conn, {t:'state', S});
    if(S.stage==='fib') send(conn, {t:'dots', d:dotList()});
    if(S.skySpot && H.skySpotImg) send(conn, {t:'skyimg', img:H.skySpotImg, id:S.skySpot.id});
    hostRender(); return;
  }
  let st = null; for(const s of H.students.values()) if(s.conn===conn){ st=s; break; }
  if(!st) return;
  switch(m.t){
    case 'dot':
      if(S.stage==='fib' && S.fibPhase==='ask' && !S.fibRev && m.q===S.fibI){ st.dot={x:clamp01(m.x), y:clamp01(m.y), q:S.fibI}; queueDots(); hostRender(); }
      break;
    case 'sort':
      if(m.round===S.sortRound){ st.sort={round:m.round, correct:+m.correct||0, total:+m.total||0, misses:Array.isArray(m.misses)?m.misses.slice(0,20).map(String):[]}; hostRender(); }
      break;
    case 'dice':
      if(m.id===S.diceId && !S.diceRev){ st.dice={id:m.id, choice:String(m.choice).slice(0,20)}; hostRender(); }
      break;
    case 'code':
      if(m.id===S.spyId && !S.spyRev){ st.code={id:m.id, part:String(m.part||'').slice(0,4).toLowerCase(), whole:String(m.whole||'').slice(0,20).trim().toLowerCase()}; hostRender(); }
      break;
    case 'sky':
      if(typeof m.img==='string' && m.img.startsWith('data:image/') && m.img.length < 1500000){ st.sky={img:m.img, at:Date.now()}; hostRender(); }
      break;
  }
}

function drawCodeWheel(cv, rot){
  const c = cv.getContext('2d'), n = CODE_WORDS.length, R = 155, cx = 160, cy = 160, seg = Math.PI*2/n;
  c.clearRect(0,0,320,320);
  CODE_WORDS.forEach((w,i)=>{
    c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,R,rot+i*seg,rot+(i+1)*seg); c.closePath();
    c.fillStyle = CODE_COLS[i%4]; c.fill(); c.strokeStyle='#FFF6E6'; c.lineWidth=3; c.stroke();
    const a = rot+(i+.5)*seg;
    c.save(); c.translate(cx+Math.cos(a)*R*.7, cy+Math.sin(a)*R*.7); c.rotate(a+Math.PI/2);
    c.font = '30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(w.pic, 0, 0); c.restore();
  });
  c.beginPath(); c.arc(cx,cy,22,0,Math.PI*2); c.fillStyle='#3A2619'; c.fill();
  c.font='20px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('🦝',cx,cy+1);
}
function spinCode(){
  if(H.codeSpinning) return;
  const n = CODE_WORDS.length, seg = Math.PI*2/n;
  let pool = CODE_WORDS.map((_,i)=>i).filter(i=>!H.codeUsed.includes(i));
  if(!pool.length){ H.codeUsed = []; pool = CODE_WORDS.map((_,i)=>i).filter(i=>i!==S.spyIdx); }
  const idx = pool[Math.floor(Math.random()*pool.length)]; H.codeUsed.push(idx);
  const start = H.codeRot, target = 1.5*Math.PI - (idx+.5)*seg + (Math.random()-.5)*seg*.6;
  const k = Math.ceil((start + 8*Math.PI - target)/(2*Math.PI)), end = target + 2*Math.PI*k, dur = 3200, t0 = performance.now();
  H.codeSpinning = true; setS({spySpin:true, spyRev:false});
  const frame = now => {
    const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,3);
    H.codeRot = start + (end-start)*e;

function sConnect(){
  if(P.peer && !P.peer.destroyed){ if(P.peer.open) openConn(); return; }
  const peer = new Peer(); P.peer = peer;
  peer.on('open', openConn);
  peer.on('error', err => {
    if(err.type === 'peer-unavailable'){
      if(!P.joined){ try{ peer.destroy(); }catch(e){} P.peer = null; showJoin(P.room, 'That room isn’t open. Check the code, or wait for your teacher to open it.'); }
      else scheduleRetry();
    } else scheduleRetry();
  });
  peer.on('disconnected', () => { try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
}
function openConn(){
  if(!P.peer || !P.peer.open) return;
  const c = P.peer.connect(ROOM_PREFIX + P.room, {reliable:true});
  const old = P.conn; P.conn = c; if(old){ try{ old.close(); }catch(e){} }
  c.on('open', () => { c.send({t:'hello', sid:P.sid, name:P.name}); setConn(true); });
  c.on('data', sMsg);
  c.on('close', () => { if(P.conn === c){ setConn(false); scheduleRetry(); } });
  c.on('error', () => {});
}
function scheduleRetry(){
  if(P.retryT) return;
  P.retryT = setTimeout(() => {
    P.retryT = null;
    if(P.conn && P.conn.open) return;
    if(!P.peer || P.peer.destroyed){ P.peer = null; sConnect(); }
    else if(P.peer.disconnected){ try{ P.peer.reconnect(); }catch(e){} setTimeout(openConn, 1200); }
    else openConn();
    scheduleRetryCheck();
  }, 2500);
}
function scheduleRetryCheck(){ setTimeout(()=>{ if(P.joined && !(P.conn && P.conn.open)) scheduleRetry(); }, 5000); }
function setConn(on){ const d = $('#sConn'); if(d){ d.classList.toggle('on', on); d.title = on ? 'Connected' : 'Reconnecting…'; } }
function sendHost(m){ try{ if(P.conn && P.conn.open){ P.conn.send(m); return true; } }catch(e){} return false; }

function sMsg(m){
  if(!m || typeof m !== 'object') return;
  if(m.t === 'state'){
    const prev = SS; SS = m.S;
    if(!P.joined){ P.joined = true; sShell(); }
    if(prev){
      for(const [st,l] of LOCK) if(SS.letters && SS.letters[st] && !(prev.letters||{})[st]){ P.fresh = st; toast('🔓 Your class earned the letter ' + l + '!'); }
      if(SS.unlocked && !prev.unlocked) toast('🔓 The lock is open!');
    }
    if(!prev || prev.fibI !== SS.fibI){ P.dot = null; if(prev) stopSpeech(); }
    if(!P.sort || P.sort.round !== SS.sortRound) P.sort = {round:SS.sortRound, go:0, order:shuffle(SORT_WORDS.map(w=>w.w)), place:{}, sel:null, done:false, end:0};
    if(SS.sortGo && P.sort.go !== SS.sortGo){ P.sort.go = SS.sortGo; P.sort.place = {}; P.sort.sel = null; P.sort.done = false; P.sort.end = Date.now() + SORT_SECONDS*1000; startSortTick(); }
    if(SS.sortRev && P.sort.go && !P.sort.done) submitSort();
    if(P.diceFor !== SS.diceId){ P.diceFor = SS.diceId; P.diceChoice = null; }
    if(P.codeFor !== SS.spyId){ P.codeFor = SS.spyId; P.code = {part:'', whole:''}; }
    sRender();
  } else if(m.t === 'dots'){
    P.dots = Array.isArray(m.d) ? m.d : [];
    if(P.mounted === 'fib') SV.fib.update($('#sMain'));
  } else if(m.t === 'skyimg'){
    P.spotImg = {img:m.img, id:m.id}; sOverlay();
  }
}

function startSortTick(){
  clearInterval(P.sortTick);
  P.sortTick = setInterval(()=>{
    if(!P.sort || !P.sort.go){ clearInterval(P.sortTick); return; }
    const left = Math.max(0, Math.ceil((P.sort.end - Date.now())/1000));
    const t = $('#sTimer'); if(t) t.textContent = P.sort.done ? '' : left;
    if(left <= 0 && !P.sort.done){ submitSort(); if(P.mounted==='sort') SV.sort.update($('#sMain')); }
    if(P.sort.done) clearInterval(P.sortTick);
  }, 250);
}
function submitSort(){
  const s = P.sort; if(!s || s.done) return;
  s.done = true; s.sel = null;
  let correct = 0; const misses = [];
  SORT_WORDS.forEach(w => { if(s.place[w.w] === w.b) correct++; else misses.push(w.w); });
  sendHost({t:'sort', round:s.round, correct, total:SORT_WORDS.length, misses});
}
SV.sort = {
  mount(el){
    el.innerHTML = `<section class="panel"><div class="row between"><h2>The Root Door</h2><div class="timer" id="sTimer"></div></div><div id="srt"></div></section>`;

      const s = P.sort; if(!s || !s.go || s.done) return;
      const chip = e.target.closest('[data-w]'), bucket = e.target.closest('[data-b]');
      if(bucket && s.sel && s.sel !== (chip && chip.dataset.w)){ s.place[s.sel] = bucket.dataset.b; s.sel = null; }
      else if(chip){ const w = chip.dataset.w;
        if(s.place[w] && !chip.closest('.tray')){ delete s.place[w]; s.sel = null; }   // tap a sorted word to send it back
        else s.sel = (s.sel === w ? null : w);
      }
      else if(e.target.closest('#sDone')) submitSort();
      SV.sort.update(el);
    });
    $('#srt', el).addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-b]')){ e.preventDefault(); e.target.click(); } });
  },

    const rev = SS.sortRev, ans = Object.fromEntries(SORT_WORDS.map(w=>[w.w,w.b]));
    const chip = w => { const mark = rev ? (s.place[w]===ans[w] ? 'ok' : 'no') : ''; return `<button class="chip ${s.sel===w?'sel':''} ${mark}" data-w="${w}" type="button" ${s.done?'tabindex="-1"':''}>${w}${rev?(mark==='ok'?' ✓':' ✗'):''}</button>`; };
    const tray = s.order.filter(w=>!s.place[w]);
    const bucket = (b, head, sub) => `<div class="bucket ${s.sel&&!s.done?'ready':''}" data-b="${b}" role="button" tabindex="0" aria-label="${b} bucket">
      <div class="bh">${head}</div><div class="bs">${sub}</div><div class="chips">${s.order.filter(w=>s.place[w]===b).map(chip).join('')}</div></div>`;

    if(SS.spySpin){ box.innerHTML = `<div class="waitcard"><div class="big" aria-hidden="true">🔐</div><h2>Decoding…</h2><p class="sub" style="margin:auto">The code wheel is spinning!</p></div>`; return; }
    if(!c){ box.innerHTML = `<div class="waitcard"><div class="big" aria-hidden="true">🦝</div><h2>Waiting for the code wheel…</h2><p class="sub" style="margin:auto">Get ready to type oi or oy.</p></div>`; return; }
    const rev = SS.spyRev, right = P.code.part === c.sp;
    box.innerHTML = `<div class="codecard">
        <div class="pic" aria-hidden="true">${c.pic}</div>
        <p class="cw">${esc(c.pre)}<input id="cPart" class="blankin ${rev ? (right?'ok':'no') : ''}" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type oi or oy" value="${esc(P.code.part)}" ${rev?'disabled':''}>${esc(c.post)}</p>
        <p class="hint">${hintHTML(c, false)}</p>
      </div>
      ${rev ? '' : '<p class="sub" style="text-align:center">Type <b>oi</b> or <b>oy</b> in the blank.</p>'}
      <label class="bonus">⭐ Bonus: type the whole word <input id="cWhole" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(P.code.whole)}" ${rev?'disabled':''}></label>
      <p class="sub" id="cStatus" aria-live="polite"></p>
      ${rev ? `<div class="reveal">${right ? '🌰 Decoded! ' : ''}The word is <b>${esc(c.w)}</b>. ${whyHTML(c)}${P.code.whole.trim().toLowerCase()===c.w ? '<p>⭐ You typed the whole word correctly!</p>' : ''}</div>` : ''}`;
    if(!rev){ const inp = $('#cPart', box); if(inp && !P.code.part) inp.focus({preventScroll:true}); }
  }
};

/* ============ NIGHT SKY DRAWING ============ */
function drawSkyOutline(c){
  c.save();
  c.fillStyle = '#fff'; c.fillRect(0,0,SKY_W,SKY_H);
  c.strokeStyle = '#8f8a84'; c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round';
  // ground
  c.beginPath(); c.moveTo(0,455); c.bezierCurveTo(200,405,420,475,620,435); c.bezierCurveTo(740,410,830,432,SKY_W,425);
  c.lineTo(SKY_W,SKY_H); c.lineTo(0,SKY_H); c.closePath(); c.stroke();
  // crescent moon
  const A={x:170,y:130,r:62}, B={x:196,y:112,r:54};
  const pts = circleHits(A,B);
  if(pts){
    const [p1,p2] = pts;
    const a1 = Math.atan2(p1.y-A.y,p1.x-A.x), a2 = Math.atan2(p2.y-A.y,p2.x-A.x);
    const b1 = Math.atan2(p1.y-B.y,p1.x-B.x), b2 = Math.atan2(p2.y-B.y,p2.x-B.x);
    // outer arc: the long way through the left side (angle π)
    c.beginPath();
    const outerCW = arcContains(a1, a2, false, Math.PI);
    c.arc(A.x,A.y,A.r,a1,a2,!outerCW);
    const toC = Math.atan2(A.y-B.y, A.x-B.x);   // inner edge faces the outer circle's center
    const innerCW = arcContains(b2, b1, false, toC);
    c.arc(B.x,B.y,B.r,b2,b1,!innerCW);
    c.closePath(); c.stroke();
  }
  // Cassiopeia (a fall constellation) with dashed guide lines
  const cas = [[430,92],[482,142],[532,104],[586,150],[634,96]];
  c.save(); c.setLineDash([6,8]); c.lineWidth = 2; c.strokeStyle = '#b9b3ab';
  c.beginPath(); cas.forEach(([x,y],i)=> i ? c.lineTo(x,y) : c.moveTo(x,y)); c.stroke(); c.restore();
  cas.forEach(([x,y]) => starPath(c,x,y,14));
  [[300,58],[790,70],[355,215],[860,190],[64,270],[700,40],[250,300]].forEach(([x,y]) => starPath(c,x,y,9));
  // tree trunk + crown
  c.beginPath(); c.moveTo(704,438); c.lineTo(713,318); c.lineTo(747,318); c.lineTo(758,436); c.closePath(); c.stroke();
  c.beginPath();
  const cx0=730, cy0=238, rx=118, ry=92, bumps=10;
  for(let i=0;i<=bumps;i++){
    const t = i/bumps*Math.PI*2, x = cx0+Math.cos(t)*rx, y = cy0+Math.sin(t)*ry;
    if(i===0) c.moveTo(x,y);
    else { const tm=(i-.5)/bumps*Math.PI*2; c.quadraticCurveTo(cx0+Math.cos(tm)*rx*1.22, cy0+Math.sin(tm)*ry*1.22, x, y); }
  }
  c.closePath(); c.stroke();
  // falling leaves
  [[470,320,-.5],[585,250,.6],[120,380,.2]].forEach(([x,y,r]) => leafPath(c,x,y,r));
  c.restore();
}
function circleHits(A,B){
  const dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy);
  if(d > A.r+B.r || d < Math.abs(A.r-B.r)) return null;
  const a=(A.r*A.r - B.r*B.r + d*d)/(2*d), h=Math.sqrt(A.r*A.r - a*a);
  const mx=A.x+a*dx/d, my=A.y+a*dy/d;
  return [{x:mx+h*dy/d, y:my-h*dx/d},{x:mx-h*dy/d, y:my+h*dx/d}];
}
function norm(a){ a%=Math.PI*2; return a<0 ? a+Math.PI*2 : a; }
// does going clockwise (increasing angle) from s to e pass through angle t?
function arcContains(s, e, _unused, t){ const span = norm(e-s), off = norm(t-s); return off <= span; }
function starPath(c,x,y,r){
  c.beginPath();
  for(let i=0;i<10;i++){ const ang = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*.45 : r; const px=x+Math.cos(ang)*rr, py=y+Math.sin(ang)*rr; i ? c.lineTo(px,py) : c.moveTo(px,py); }
  c.closePath(); c.stroke();
}
function leafPath(c,x,y,rot){
  c.save(); c.translate(x,y); c.rotate(rot);
  c.beginPath(); c.moveTo(-26,0); c.quadraticCurveTo(0,-22,26,0); c.quadraticCurveTo(0,22,-26,0); c.closePath(); c.stroke();
  c.beginPath(); c.moveTo(-34,0); c.lineTo(22,0); c.stroke();
  c.restore();
}
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function floodFill(ctx, x, y, fill){
  const W=ctx.canvas.width, Hh=ctx.canvas.height;
  x=Math.floor(x); y=Math.floor(y); if(x<0||y<0||x>=W||y>=Hh) return;
  const img=ctx.getImageData(0,0,W,Hh), d=img.data, i0=(y*W+x)*4;
  const tr=d[i0], tg=d[i0+1], tb=d[i0+2];
  if(Math.abs(tr-fill[0])+Math.abs(tg-fill[1])+Math.abs(tb-fill[2]) < 12) return;
  const tol=120, seen=new Uint8Array(W*Hh);
  const match = p => { const k=p*4; return !seen[p] && Math.abs(d[k]-tr)+Math.abs(d[k+1]-tg)+Math.abs(d[k+2]-tb) <= tol; };
  const stack=[x,y];
  while(stack.length){
    const py=stack.pop(); let px=stack.pop(), p=py*W+px;
    while(px>0 && match(p-1)){ px--; p--; }
    let up=false, down=false;
    while(px<W && match(p)){
      seen[p]=1; const k=p*4; d[k]=fill[0]; d[k+1]=fill[1]; d[k+2]=fill[2]; d[k+3]=255;
      if(py>0){ if(match(p-W)){ if(!up){ stack.push(px,py-1); up=true; } } else up=false; }
      if(py<Hh-1){ if(match(p+W)){ if(!down){ stack.push(px,py+1); down=true; } } else down=false; }
      px++; p++;
    }
  }
  ctx.putImageData(img,0,0);
}
function drawArrow(c,a,b,color,w){
  const ang=Math.atan2(b.y-a.y,b.x-a.x), hl=Math.max(18,w*3.2);
  c.save(); c.strokeStyle=color; c.fillStyle=color; c.lineWidth=w; c.lineCap='round';
  c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x-Math.cos(ang)*hl*.6, b.y-Math.sin(ang)*hl*.6); c.stroke();
  c.beginPath(); c.moveTo(b.x,b.y);
  c.lineTo(b.x-hl*Math.cos(ang-.45), b.y-hl*Math.sin(ang-.45));
  c.lineTo(b.x-hl*Math.cos(ang+.45), b.y-hl*Math.sin(ang+.45)); c.closePath(); c.fill();
  c.restore();
}
function drawStamp(c,text,x,y){
  c.save(); c.font='bold 22px "Atkinson Hyperlegible", sans-serif';
  const w=c.measureText(text).width+26, h=36, l=Math.min(Math.max(4,x-w/2),SKY_W-w-4), t=Math.min(Math.max(4,y-h/2),SKY_H-h-4);
  c.beginPath(); if(c.roundRect) c.roundRect(l,t,w,h,18); else c.rect(l,t,w,h);
  c.fillStyle='#fff'; c.fill(); c.lineWidth=3; c.strokeStyle='#C2412D'; c.stroke();
  c.fillStyle='#3A2619'; c.textBaseline='middle'; c.fillText(text,l+13,t+h/2+1);
  c.restore();
}
function initSky(el){
  const cv=$('#kCan',el), cx=cv.getContext('2d',{willReadFrequently:true});
  const K = P.skyTool || (P.skyTool = {tool:'pen', color:'#F5D547', size:1, stamp:STAMPS[0]});
  const SIZES=[[4,'Thin'],[9,'Medium'],[18,'Thick']];
  if(P.skyImage) cx.putImageData(P.skyImage,0,0); else drawSkyOutline(cx);
  P.skyCtx = cx;
  const undo = P.skyUndo;
  const sync = () => {
    el.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.tool===K.tool));
    el.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('sel', b.dataset.c===K.color));
    el.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('sel', b.dataset.s===K.stamp));
    $('#kStamps',el).hidden = K.tool!=='label';
    $('#kSize',el).innerHTML = `<span style="display:inline-block;width:${SIZES[K.size][0]+4}px;height:${SIZES[K.size][0]+4}px;border-radius:50%;background:${K.color};border:1px solid #999"></span><span>${SIZES[K.size][1]}</span>`;
    cv.style.cursor = K.tool==='fill' ? 'cell' : 'crosshair';
  };
  sync();
  el.querySelector('.tools').addEventListener('click', e => {
    const t=e.target.closest('[data-tool]'), c=e.target.closest('[data-c]');
    if(t){ K.tool=t.dataset.tool; }
    if(c){ K.color=c.dataset.c; if(K.tool==='eraser'||K.tool==='label') K.tool='pen'; }
    if(e.target.closest('#kSize')) K.size=(K.size+1)%SIZES.length;
    if(e.target.closest('#kUndo')){ const s=undo.pop(); if(s) cx.putImageData(s,0,0); else toast('Nothing to undo.'); }
    if(e.target.closest('#kClear')){ snap(); drawSkyOutline(cx); toast('Fresh picture. Tap Undo to bring yours back.'); }
    sync();
  });
  $('#kStamps',el).onclick = e => { const s=e.target.closest('[data-s]'); if(s){ K.stamp=s.dataset.s; sync(); toast('Tap the picture to place the label.'); } };
  const pos = e => { const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*SKY_W/r.width, y:(e.clientY-r.top)*SKY_H/r.height}; };
  function snap(){ undo.push(cx.getImageData(0,0,SKY_W,SKY_H)); if(undo.length>12) undo.shift(); }
  let drawing=false, last=null, start=null, base=null;
  const stroke = (a,b) => {
    cx.save(); cx.strokeStyle = K.tool==='eraser' ? '#ffffff' : K.color;
    cx.lineWidth = SIZES[K.size][0] * (K.tool==='eraser' ? 2.5 : 1); cx.lineCap='round'; cx.lineJoin='round';
    cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x+.01,b.y); cx.stroke(); cx.restore();
  };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); const p=pos(e);
    if(K.tool==='fill'){ snap(); floodFill(cx,p.x,p.y,hexRgb(K.color)); return; }
    if(K.tool==='label'){ snap(); drawStamp(cx,K.stamp,p.x,p.y); return; }
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    snap(); drawing=true; last=p; start=p;
    if(K.tool==='arrow') base=cx.getImageData(0,0,SKY_W,SKY_H); else stroke(p,p);
  });
  cv.addEventListener('pointermove', e => {
    if(!drawing) return; const p=pos(e);
    if(K.tool==='arrow'){ cx.putImageData(base,0,0); drawArrow(cx,start,p,K.color,Math.max(4,SIZES[K.size][0]*.8)); }
    else { stroke(last,p); last=p; }
  });
  const end = e => {
    if(!drawing) return; drawing=false;
    if(K.tool==='arrow' && e && e.type==='pointerup'){ const p=pos(e); if(Math.hypot(p.x-start.x,p.y-start.y) < 12){ cx.putImageData(base,0,0); undo.pop(); toast('Drag to draw an arrow.'); } }
    base=null;
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $('#kSend',el).onclick = () => {
    const o=document.createElement('canvas'); o.width=600; o.height=Math.round(600*SKY_H/SKY_W);
    o.getContext('2d').drawImage(cv,0,0,o.width,o.height);
    if(sendHost({t:'sky', img:o.toDataURL('image/jpeg',0.72)})) toast('Sent! Your teacher can see your night sky.');
    else toast('Not connected. Try again in a moment.');
  };
}

  const p = new URLSearchParams(location.search);
  if(p.get('room')) showJoin(p.get('room').toUpperCase().slice(0,5));
  else if(p.has('teacher')) startHost();
  else showLanding();
})();
